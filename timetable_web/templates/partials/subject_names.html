<div id="names-block">
  <div style="margin-bottom: 8px;">
    {% for n in subj.names %}
      <span class="name-chip">
        {{ n }}
        <small class="muted">({{ current_periods_by_teacher.get(n, 0) }} حصة)</small>
        <button hx-post="/subjects/{{ idx }}/name/remove"
                hx-vals='{"name": "{{ n }}"}'
                hx-target="#subject-editor" hx-swap="innerHTML"
                hx-confirm="إزالة {{ n }} من هذه المادة؟"
                title="إزالة">✕</button>
      </span>
    {% else %}
      <span class="muted">— لا يوجد أساتذة معيَّنون بعد —</span>
    {% endfor %}
  </div>
  <form hx-post="/subjects/{{ idx }}/name/add" hx-target="#names-block" hx-swap="outerHTML"
        hx-on::after-request="this.reset()"
        class="row" style="gap: 8px;">
    <select name="name" required style="flex: 1;">
      <option value="">— اختر أستاذاً من القائمة المركزية —</option>
      {% for n in roster_names %}
        {% if n not in subj.names %}
          <option value="{{ n }}">{{ n }} ({{ current_periods_by_teacher.get(n, 0) }} حصة حالياً)</option>
        {% endif %}
      {% endfor %}
    </select>
    <button type="submit" class="primary">+ إضافة</button>
  </form>
</div>
