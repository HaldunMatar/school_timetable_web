<tr id="manual-row-{{ mindex }}">
  <td colspan="4">
    <form hx-post="/subjects/{{ idx }}/manual/{{ mindex }}/update" hx-target="#manual-list" hx-swap="outerHTML"
          class="stack" style="gap: 8px;">
      <div class="row" style="gap: 8px; flex-wrap: wrap;">
        <label style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 4px;">
          <span class="muted" style="font-size: 12px;">الأستاذ</span>
          <select name="teacher" required>
            {% for n in subj.names %}
              <option value="{{ n }}" {% if n == row.teacher %}selected{% endif %}>{{ n }}</option>
            {% endfor %}
          </select>
        </label>
        <label style="flex: 0 0 160px; display: flex; flex-direction: column; gap: 4px;">
          <span class="muted" style="font-size: 12px;">الصف</span>
          <select name="track" required>
            {% for g in grade_order %}
              <option value="{{ g }}" data-max="{{ sections.get(g, 0) }}" {% if g == row.track %}selected{% endif %}>
                {{ grade_labels.get(g, g) }} ({{ sections.get(g, 0) }} شعبة)
              </option>
            {% endfor %}
          </select>
        </label>
      </div>
      <div>
        <div class="row" style="gap: 8px; align-items: center; margin-bottom: 4px;">
          <span class="muted" style="font-size: 12px;">الشعب</span>
          <button type="button" class="small" data-sections-select-all>تحديد الكل</button>
          <button type="button" class="small" data-sections-select-none>إلغاء التحديد</button>
        </div>
        <div data-sections-checkboxes class="row" style="gap: 6px; flex-wrap: wrap; min-height: 30px;"></div>
      </div>
      <div class="row" style="gap: 8px;">
        <button type="submit" class="primary small">💾 حفظ</button>
        <button type="button" class="small"
                hx-get="/subjects/{{ idx }}/manual-list" hx-target="#manual-list" hx-swap="outerHTML">إلغاء</button>
      </div>
    </form>
    <script>
      (function () {
        var form = document.currentScript.previousElementSibling;
        var trackSel = form.querySelector('[name="track"]');
        var container = form.querySelector('[data-sections-checkboxes]');
        var initialKeep = [{% for s in row.sections %}"{{ s }}"{% if not loop.last %},{% endif %}{% endfor %}];
        function sync(useInitial) {
          var opt = trackSel.selectedOptions[0];
          var max = opt ? parseInt(opt.getAttribute("data-max") || "0", 10) : 0;
          window.__fillSectionCheckboxes(container, max, useInitial ? initialKeep : null);
        }
        trackSel.addEventListener("change", function () { sync(false); });
        form.querySelector('[data-sections-select-all]').addEventListener("click", function () {
          container.querySelectorAll("input[type=checkbox]").forEach(function (cb) { cb.checked = true; });
        });
        form.querySelector('[data-sections-select-none]').addEventListener("click", function () {
          container.querySelectorAll("input[type=checkbox]").forEach(function (cb) { cb.checked = false; });
        });
        sync(true);
      })();
    </script>
  </td>
</tr>
