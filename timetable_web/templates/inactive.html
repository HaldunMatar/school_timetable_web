<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الحساب غير مفعَّل</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #fef3c7; }
    .box { background: white; padding: 40px 32px; border-radius: 12px; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h1 { color: #b45309; margin: 0 0 12px 0; }
    p { color: var(--muted); line-height: 1.7; }
    .u { font-weight: bold; color: var(--ink); }
    .actions { margin-top: 24px; display: flex; gap: 8px; justify-content: center; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🚫</div>
    <h1>الحساب غير مفعَّل</h1>
    <p>
      حساب <span class="u">{{ user.username }}</span> موجود في النظام لكنه <strong>غير مفعَّل</strong> حالياً.
      <br><br>
      لا تستطيع العمل على البرنامج حتى يُفعِّل المدير حسابك.
      <br><br>
      يُرجى التواصل مع مدير النظام لتفعيل حسابك.
    </p>
    <div class="actions">
      <a class="btn" href="/logout">تسجيل الخروج</a>
    </div>
  </div>
</body>
</html>
