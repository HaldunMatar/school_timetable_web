<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: linear-gradient(135deg, #1f4e78 0%, #4c8bd9 100%); }
    .login-box { background: white; padding: 40px 32px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
    .login-box h1 { margin: 0 0 6px 0; font-size: 20px; color: var(--ink); text-align: center; }
    .login-box .subtitle { color: var(--muted); text-align: center; margin: 0 0 24px 0; font-size: 13px; }
    .login-box label { display: block; margin: 12px 0 4px 0; font-size: 13px; color: var(--muted); }
    .login-box input { padding: 10px; font-size: 14px; }
    .login-box button { width: 100%; padding: 12px; margin-top: 20px; font-size: 15px; font-weight: 600; }
    .error-box { background: #fee2e2; color: #b91c1c; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <form class="login-box" method="post" action="/login">
    <h1>برنامج توزيع الأساتذة والحصص</h1>
    <p class="subtitle">تسجيل الدخول</p>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <label for="u">اسم المستخدم</label>
    <input id="u" type="text" name="username" required autofocus autocomplete="username">
    <label for="p">كلمة المرور</label>
    <input id="p" type="password" name="password" required autocomplete="current-password">
    <button type="submit" class="primary">دخول</button>
  </form>
</body>
</html>
