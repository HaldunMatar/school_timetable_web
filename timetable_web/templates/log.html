{% extends "base.html" %}
{% block title %}سجل العمليات{% endblock %}
{% block content %}
<section class="stack">
  <div class="row" style="justify-content: space-between; align-items: baseline;">
    <h1>سجل العمليات</h1>
    <span class="muted">{{ store.log_entries|length }} إدخال · يتحدث تلقائياً كل 3 ثوانٍ</span>
  </div>
  <div class="card" style="padding: 0;" hx-get="/log/tail" hx-trigger="every 3s" hx-swap="innerHTML" id="log-body">
    {% include "partials/log_tail.html" %}
  </div>
</section>

<style>
  .log-full { max-height: 65vh; overflow-y: auto; padding: 12px 16px; font-family: -apple-system, "SF Mono", Menlo, monospace; font-size: 13px; direction: ltr; text-align: right; }
  .log-full ol { list-style: none; margin: 0; padding: 0; }
  .log-full li { padding: 3px 0; border-bottom: 1px dashed var(--border); }
  .log-full li:last-child { border-bottom: none; }
  .log-full .ts { color: var(--muted); margin-inline-end: 8px; }
</style>
{% endblock %}
