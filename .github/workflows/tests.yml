name: Tests

# يشتغل تلقائياً في كل push إلى أي فرع، وفي كل Pull Request إلى main.
# يمكن تشغيله يدوياً أيضاً من تبويب Actions.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: إعداد Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: تثبيت المشروع + المتطلبات (بما فيها dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: تشغيل pytest (كل الاختبارات بما فيها slow)
        run: pytest -q --tb=short
